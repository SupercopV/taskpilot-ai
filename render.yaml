services:
  - type: web
    name: taskpilot-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PLAYWRIGHT_HEADLESS
        value: "true"
      - key: APPROVAL_THRESHOLD_INR
        value: "100000"
      - key: FRONTEND_URL
        value: "*"
